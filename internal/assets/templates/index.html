{{define "index"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{.Site.Title}}</title>
{{- if .Site.Description}}
<meta name="description" content="{{.Site.Description}}">
{{- end}}
{{template "head" .}}
</head>
{{template "body-start" .}}
<main class="vp-main">
  {{- if .Site.Description}}
  <p class="vp-container g-text g-text_variant_body-2 g-color-text g-color-text_color_secondary">{{.Site.Description}}</p>
  {{- end}}
  {{- if .Modules}}
  <section class="vp-container vp-modules" aria-label="Modules">
    {{template "children" .Modules}}
  </section>
  {{- end}}
</main>
{{template "body-end" .}}
</html>
{{end}}
